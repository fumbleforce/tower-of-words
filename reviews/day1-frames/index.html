<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Day 1 · read and choose</title><link rel="stylesheet" href="./style.css"></head>
<body><header><a href="/bible/#review/day1-frames">← Review</a><h1>Day 1 edits</h1><strong id="progress">0 of 29 decided</strong></header>
<main><nav class="passage-nav" aria-label="Passages"><button id="previous" aria-label="Previous passage">←</button><label class="sr" for="passages">Choose a passage</label><select id="passages"></select><button id="next" aria-label="Next passage">→</button></nav>
<section aria-labelledby="title"><div class="heading"><span id="position"></span><span id="decision"></span></div><h2 id="title">Loading…</h2><p id="summary"></p>
<div class="decision-buttons"><button id="keep">Keep original</button><button id="apply">Use revision</button><button id="clear">Decide later</button></div>
<div id="passage" aria-label="Original and proposed passage"></div>
<label class="comment-label" for="comment">Note for this passage <span>(optional)</span></label><textarea id="comment" rows="2" placeholder="Keep this part, but…"></textarea></section>
<footer><p id="status" role="status">Loading saved decisions…</p><button id="save">Save decisions</button></footer>
</main><script type="module" src="./viewer.js"></script></body></html>
