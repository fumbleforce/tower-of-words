<!doctype html><html><head>
<meta name="robots" content="noindex, nofollow"><meta charset="utf-8">
<!-- Every creature's model and poses on one sheet (js/creatures/models.js, meshes.js), for close checks:
     a row per bird (resting, pecking, wings up, wings down, gliding, banking), the cats, the insects.
     ?el=<degrees> camera elevation (default 30; the game's is about 55), ?d=<distance> -->
<script type="importmap">{ "imports": { "three": "../vendor/three/three.module.js", "three/addons/": "../vendor/" } }</script>
<style>html,body{margin:0;height:100%;background:#8d8a86}canvas{display:block}</style></head><body>
<script type="module">
import * as THREE from 'three';
import { BirdMeshes, InsectMeshes } from '../js/creatures/meshes.js';
import { catGeometry, butterflyGeometry, dragonflyGeometry } from '../js/creatures/models.js';
const q = new URLSearchParams(location.search);
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setSize(innerWidth, innerHeight); document.body.appendChild(r.domElement);
r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.NeutralToneMapping;
const s = new THREE.Scene(); s.background = new THREE.Color('#a8a29a');
s.add(new THREE.HemisphereLight('#d3def0', '#8a7a68', 2.0));
const sun = new THREE.DirectionalLight('#ffe8d0', 2.4); sun.position.set(-2, 5, 3); s.add(sun);
const fl = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: '#c9c2b8' }));
fl.rotation.x = -Math.PI / 2; s.add(fl);
const poses = [
  { yaw: 0.6, pitch: 0, flap: 0, fold: 1 },
  { yaw: -0.6, pitch: 0.65, flap: 0, fold: 1 },
  { yaw: 0.6, pitch: 0, flap: 0.95, fold: 0, y: 0.3 },
  { yaw: 0.6, pitch: 0, flap: -0.8, fold: 0, y: 0.3 },
  { yaw: 2.5, pitch: 0, flap: 0.12, fold: 0, y: 0.3 },
  { yaw: 0.0, pitch: 0, flap: 0.12, fold: 0, roll: 0.35, y: 0.3 },
];
const kinds = ['pigeon', 'sparrow', 'crow', 'gull'];
kinds.forEach((kind, row) => {
  const m = new BirdMeshes(kind, poses.length, 1.25);
  poses.forEach((p, col) => {
    m.pose(col, { p: new THREE.Vector3(col * 1.1 - 2.8, p.y || 0, row * 1.1 - 2.2), yaw: p.yaw, pitch: p.pitch, roll: p.roll || 0, flap: p.flap, fold: p.fold, size: 1 });
  });
  m.commit(true); s.add(m.group);
});
['black', 'tabby', 'ginger'].forEach((coat, i) => {
  const g = catGeometry(coat), mat = new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.92 });
  const root = new THREE.Group(); root.scale.setScalar(1.3); root.position.set(i * 0.9 - 2.8, 0, 2.4); root.rotation.y = 0.5;
  const head = new THREE.Group(); head.position.set(...g.headAt); head.add(new THREE.Mesh(g.head, mat)); head.rotation.y = i * 0.4 - 0.4;
  const tail = new THREE.Group(); tail.position.set(...g.tailAt); tail.add(new THREE.Mesh(g.tail, mat));
  root.add(new THREE.Mesh(g.body, mat), head, tail); s.add(root);
});
const bf = new InsectMeshes(butterflyGeometry(), 2, 1.6), df = new InsectMeshes(dragonflyGeometry(), 1, 1.5);
bf.pose(0, new THREE.Vector3(0.5, 0.3, 2.4), 0.4, 0, new THREE.Color('#f4dd6a')); bf.pose(1, new THREE.Vector3(1.0, 0.3, 2.4), 0.4, 0.7, new THREE.Color('#fbf8ee'));
df.pose(0, new THREE.Vector3(1.6, 0.3, 2.4), 0.4, 0); bf.commit(true); df.commit(true); s.add(bf.mesh, df.mesh);
const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 100);
const el = +(q.get('el') || 30) * Math.PI / 180, d = +(q.get('d') || 10);
cam.position.set(0, Math.sin(el) * d, 0.2 + Math.cos(el) * d); cam.lookAt(0, 0, 0.2);
r.render(s, cam); window.__done = true;
</script></body></html>
