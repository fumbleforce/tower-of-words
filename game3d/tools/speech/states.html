<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice input states</title>
<link rel="stylesheet" href="../../css/style.css">
<style>
  /* a frame from the game behind the prompt, so the row is judged where it will sit */
  html, body { margin: 0; height: 100%; background: #0e121c; overflow: hidden; }
  #bg { position: fixed; inset: 0; background-size: cover; background-position: center; filter: saturate(.95); }
  #talk { pointer-events: auto; }
  #stateTag { position: fixed; top: 10px; left: 12px; z-index: 50; font: 700 13px/1 system-ui; color: #10151c; background: #6fd0c6; padding: 5px 9px; border-radius: 6px; }
</style>
</head>
<body>
<div id="bg"></div>
<div id="stateTag"></div>
<div id="ui">
  <div id="stage"><div class="focus"></div></div>
  <div id="talk">
    <div class="who"></div>
    <div class="line"></div>
    <div class="chips"></div>
    <div class="more" aria-hidden="true" hidden><span class="ch"></span><i></i></div>
    <div class="wait" aria-hidden="true"><i></i><i></i><i></i></div>
  </div>
  <div id="sayMenu" hidden><div class="head"></div><div class="list"></div><button type="button" class="cancel">Never mind</button></div>
  <div id="cmdsPanel" hidden><div class="card"><div class="head">Words you can say</div><p class="note">Use the Say button. It speaks to whoever or whatever is nearest.</p><ul></ul><button type="button" class="close">Close</button></div></div>
</div>
<script type="module">
// ?state=idle|asking|loading|listening|thinking|hit|miss|miss2|other|quiet|blocked|typed|saymenu|words  &phone=1  &word=matte  &mode=device|browser|off  &cancel=1
import { mountVoice } from '../../js/speech.js';
import { WORDS, iconHTML, cmdHTML, lineHTML } from '../../js/lang.js';
import { flags } from '../../js/runner.js';
import { pipsHTML, MASTERY_CSS } from '../../js/mastery.js';
const q = new URLSearchParams(location.search), st = q.get('state') || 'idle', id = q.get('word') || 'matte', phone = q.get('phone') === '1';
document.body.classList.toggle('phone', phone);
document.documentElement.style.setProperty('--ui', 1);
document.body.dataset.place = 'gate'; if (phone) document.documentElement.style.setProperty('--band', '300px');
window.__settings = { voiceInput: q.get('mode') || 'device', voiceKey: 'KeyV', masteryUses: 3, voice: 1, master: 1 };
document.getElementById('bg').style.backgroundImage = `url(../../shots/shell2/hudfar-${phone ? 'phone' : 'desktop'}.png)`;
document.getElementById('stateTag').textContent = st + (phone ? ' · phone' : ' · desktop');
const css = document.createElement('style'); css.textContent = MASTERY_CSS; document.head.appendChild(css);

// the practice counts for the Say menu and Words panel views
Object.assign(flags, { practice_ohayo: 3, practice_yoroshiku: 1, practice_matte: 2, practice_sumimasen: 0 });

if (st === 'saymenu' || st === 'words') {
  document.getElementById('talk').hidden = true; document.getElementById('stage').hidden = true;
  const ids = ['ohayo', 'yoroshiku', 'sumimasen', 'matte'];
  if (st === 'saymenu') {
    const m = document.getElementById('sayMenu'); m.hidden = false;
    m.querySelector('.head').innerHTML = 'Say to <b>Guard</b>';
    m.querySelector('.list').innerHTML = '<div class="sec">Phrases</div>' + ids.slice(0, 3).map((w, i) => `<button type="button" class="cmd phrase"><span class="k">${i + 1}</span>${cmdHTML(w)}${pipsHTML(w)}</button>`).join('') +
      '<div class="sec">Commands</div>' + `<button type="button" class="cmd"><span class="k">4</span>${cmdHTML('matte')}${pipsHTML('matte')}</button>`;
    m.querySelectorAll('.cmd').forEach((b) => { b.style.display = 'flex'; b.style.alignItems = 'center'; });
  } else {
    const p = document.getElementById('cmdsPanel'); p.hidden = false;
    const row = (w) => `<li class="wrow">${iconHTML(w)}<span class="cw"><span class="jp">${WORDS[w].ja}</span><span class="rd">${WORDS[w].ro} · ${WORDS[w].en}</span></span>${pipsHTML(w)}</li>`;
    p.querySelector('ul').innerHTML = `<li class="sec">Phrases</li>${ids.slice(0, 3).map(row).join('')}<li class="sec">Commands <span>(they make old machines listen)</span></li>${row('matte')}`;
  }
} else {
  // the typing prompt as ui.js typePrompt draws it
  const w = WORDS[id], t = document.getElementById('talk');
  t.classList.add('typing', 'in');
  const toks = [...w.ro].map((ch) => (/\s|-/.test(ch) ? '<span class="sp"> </span>' : `<span class="lt">${ch}</span>`)).join('');
  t.querySelector('.line').innerHTML = `<div class="tp-prompt"><span class="tp-who" style="color:#6fd0c6">Mio</span> ${lineHTML('Say it to the door. Just the one word.')}</div>` +
    `<div class="tp"><div class="tp-word">${iconHTML(id, 'wi tp-ico')}<div class="tp-jp jp">${w.ja}</div><div class="tp-ro">${toks}</div><div class="tp-en">${w.en}</div></div>` +
    `<div class="tp-ans"><input class="tp-in" type="text" autocomplete="off" placeholder="Type it in romaji" aria-label="Type ${w.ro}"><div class="tp-hint"></div>${q.get('cancel') ? '<button type="button" class="tp-cancel">Never mind</button>' : ''}</div></div>`;
  const v = mountVoice(t.querySelector('.tp'), id, { phone, ro: w.ro, ja: w.ja });
  const demo = { miss: ['miss', { heardText: 'かて' }], miss2: ['miss', { heardText: 'かて', misses: 2 }], other: ['miss', { other: 'tomatte' }], quiet: ['miss', { quiet: true }] };
  if (st === 'typed') {   // a wrong try at typing: the hint line shows the typing hint
    const ans = t.querySelector('.tp-ans'); ans.dataset.last = 'type';
    t.querySelector('.tp-in').value = w.ro.slice(0, 3) + 'x';
    t.querySelector('.tp-hint').innerHTML = `Close. Next letter: <b>${w.ro[3]}</b>. Follow the letters under the word.`;
    [...t.querySelectorAll('.tp-ro .lt')].forEach((l, i) => { l.classList.toggle('on', i < 3); l.classList.toggle('bad', i === 3); });
  } else {
    const [s, d] = demo[st] || [st, {}];
    if (v.demo) v.demo(s, d);
  }
}
window.ready = true;
</script>
</body>
</html>
