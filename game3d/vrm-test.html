<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VRM sample preview</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; height: 100dvh; display: flex; flex-direction: column; background: #dfe3e8; font: 14px system-ui, sans-serif; color: #1d2630; }
  header { padding: 10px 12px; background: #fff; }
  p { margin: 0 0 8px; }
  nav { display: flex; flex-wrap: wrap; gap: 6px; }
  select, button { font: inherit; min-height: 36px; padding: 4px 6px; }
  main { flex: 1; min-height: 0; position: relative; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #info { margin: 0; padding: 8px 12px; background: #fff; }
  body.cap header, body.cap #info { display: none; }
</style>
</head>
<body>
<header>
<p>VRoid sample by pixiv. Recolour is an unfinished colour test, with the sample's hair and clothes. <a href="../notes/vrm-prototype.md">Source and limits</a></p>
<nav id="bar" aria-label="Preview controls"></nav>
</header>
<main id="stage"></main>
<p id="info" role="status">Loading model…</p>
<script type="importmap">{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/" } }</script>
<script type="module">
import * as THREE from 'three';
import { loadVrmMio } from './js/vrm/mio.js';
import { attachOrbit } from '../tools/style-concepts/viewer-kit.js';
const Q = new URLSearchParams(location.search);
const variant = Q.get('variant') || 'base', view = Q.get('view') || 'three', anim = Q.get('anim') || 'idle';
if (Q.has('cap')) document.body.classList.add('cap');
const bar = document.getElementById('bar');
for (const [key, values, selected] of [
  ['variant', ['base', 'recolour', 'flat'], variant],
  ['view', ['front', 'three', 'face', 'game'], view],
  ['anim', ['idle', 'walk', 'run'], anim],
]) {
  const label = document.createElement('label');
  label.textContent = key + ' ';
  const select = document.createElement('select');
  select.setAttribute('aria-label', key);
  for (const value of values) select.add(new Option(value, value, false, value === selected));
  select.onchange = () => { Q.set(key, select.value); location.search = Q.toString(); };
  label.append(select); bar.append(label);
}
const pause = document.createElement('button');
pause.textContent = 'Pause';
let paused = false;
pause.onclick = () => { paused = !paused; pause.textContent = paused ? 'Play' : 'Pause'; };
bar.append(pause);
const happy = document.createElement('button');
happy.textContent = 'Smile';
bar.append(happy);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.shadowMap.enabled = true;
const stage = document.getElementById('stage');
stage.append(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#dfe3e8');
scene.add(new THREE.HemisphereLight('#f2f5ff', '#8a8f86', 1.6));
const sun = new THREE.DirectionalLight('#fff6e8', 2.2);
sun.position.set(2, 4, 3); sun.castShadow = true; scene.add(sun);
const floor = new THREE.Mesh(new THREE.CircleGeometry(1.2, 48), new THREE.MeshLambertMaterial({ color: '#c9ced4' }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const camera = new THREE.PerspectiveCamera(30, 1, 0.01, 50);
try {
  const start = performance.now();
  const character = await loadVrmMio({ original: variant === 'base', flat: variant === 'flat' });
  scene.add(character.root); character.setState(anim);
  let smiling = false;
  happy.onclick = () => { smiling = !smiling; character.vrm.expressionManager.setValue('happy', smiling ? 1 : 0); happy.textContent = smiling ? 'Neutral' : 'Smile'; };
  let triangles = 0;
  character.root.traverse(o => { if (o.isMesh) triangles += (o.geometry.index?.count || o.geometry.attributes.position.count) / 3; });
  let yaw = view === 'three' ? 0.5 : 0, zoom = 1, tilt = view === 'game' ? 56 * Math.PI / 180 : 0.05;
  attachOrbit(renderer.domElement, {
    rotate(dx, dy) { yaw -= dx * 0.008; tilt = THREE.MathUtils.clamp(tilt + dy * 0.006, -0.5, 1.3); },
    zoom(factor) { zoom = THREE.MathUtils.clamp(zoom * factor, 0.45, 3); },
  });
  function frame() {
    const width = stage.clientWidth, height = stage.clientHeight;
    renderer.setSize(width, height, false); camera.aspect = width / height;
    const face = view === 'face';
    camera.fov = 30;
    const target = face ? 1.01 : 0.58;
    const distance = (face ? 0.95 : 2.8) * zoom * Math.max(1, 0.7 / camera.aspect);
    camera.position.set(Math.sin(yaw) * Math.cos(tilt) * distance, target + Math.sin(tilt) * distance, Math.cos(yaw) * Math.cos(tilt) * distance);
    camera.lookAt(0, target, 0); camera.updateProjectionMatrix();
  }
  for (let i = 0; i < 40; i++) character.update(1 / 60);
  const clock = new THREE.Clock();
  const info = { triangles: Math.round(triangles), loadMs: Math.round(performance.now() - start) };
  function render() { frame(); renderer.render(scene, camera); }
  renderer.setAnimationLoop(() => {
    const dt = Math.min(0.05, clock.getDelta());
    if (!paused) character.update(dt);
    render();
    document.getElementById('info').textContent = `${info.triangles.toLocaleString()} triangles · ${renderer.info.render.calls} page draw calls including shadows. Drag to turn; pinch or scroll to zoom.`;
  });
  render();
  globalThis.__preview = { character, setPaused(value) { paused = value; }, step(dt) { character.update(dt); render(); } };
  globalThis.__ready = { ...info, calls: renderer.info.render.calls };
  addEventListener('pagehide', () => { renderer.setAnimationLoop(null); character.mixer.stopAllAction(); renderer.dispose(); });
} catch (error) {
  document.getElementById('info').textContent = 'Preview could not load: ' + error.message;
  globalThis.__error = error.message;
  throw error;
}
</script>
</body>
</html>
