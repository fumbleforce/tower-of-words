<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Amakawa · Opening</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; font: 600 16px/1.3 "Zen Kaku Gothic New", system-ui, sans-serif; color: #eef0f4; }
  #op { display: block; background: #000; }
  #start { position: fixed; inset: 0; margin: auto; width: max-content; height: max-content; display: flex; align-items: center; gap: 14px;
    padding: 16px 30px 16px 22px; border: 1px solid rgba(255, 255, 255, .22); border-radius: 999px; background: rgba(14, 18, 28, .72);
    color: #eef0f4; font: inherit; font-size: 20px; letter-spacing: .04em; cursor: pointer; opacity: .55; transition: opacity .2s, background .2s; }
  #start.ready { opacity: 1; }
  #start:hover, #start:focus-visible { background: rgba(14, 18, 28, .9); outline: none; border-color: #6fd0c6; }
  #start i { width: 0; height: 0; border-left: 15px solid #6fd0c6; border-top: 9px solid transparent; border-bottom: 9px solid transparent; }
  #start[hidden] { display: none; }
  #bar { position: fixed; right: max(16px, env(safe-area-inset-right)); top: max(16px, env(safe-area-inset-top)); display: flex; gap: 8px; opacity: 0; transition: opacity .3s; }
  #bar button { padding: 9px 16px; border: 0; border-radius: 999px; background: rgba(14, 18, 28, .55); color: rgba(238, 240, 244, .9); font: inherit; font-size: 15px; cursor: pointer; }
  #bar button:hover, #bar button:focus-visible { background: rgba(14, 18, 28, .85); outline: none; }
  #lyrics[aria-pressed="false"] { color: rgba(238, 240, 244, .55); }
  body.playing #bar, body.gate #bar, body:not(.still) #bar:focus-within { opacity: .75; }
  body.playing #bar:hover, body.playing #bar:focus-within { opacity: 1; }
  body.still #bar, body.still #start, body.done #bar { display: none; }
  /* the loading screen: the title, a rail that fills, a line saying what is being built; Play takes its place */
  #load { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 22px; background: radial-gradient(120% 90% at 50% 40%, #1d3566 0%, #0d1830 60%, #070d1c 100%); transition: opacity .5s; }
  #load .kanji { font-size: 22px; letter-spacing: .12em; color: #6fd0c6; }
  #load .word { margin-top: -14px; font-size: clamp(34px, 7vw, 58px); font-weight: 700; letter-spacing: .3em; padding-left: .3em; color: #f6f8fb; }
  #load .rail { position: relative; width: min(340px, 70vw); height: 3px; border-radius: 3px; background: rgba(238, 240, 244, .18); overflow: hidden; }
  #load-bar { position: absolute; inset: 0; background: #6fd0c6; transform-origin: left; transform: scaleX(0); transition: transform .35s ease-out; }
  #load .rail::after { content: ""; position: absolute; top: 0; bottom: 0; width: 22%; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .65), transparent); animation: run 1.4s linear infinite; }
  @keyframes run { from { transform: translateX(-120%); } to { transform: translateX(520%); } }
  #load-say { min-height: 1.3em; font-size: 15px; font-weight: 500; color: rgba(238, 240, 244, .72); letter-spacing: .02em; }
  /* loaded: the title stays as the screen Play sits on; it fades when the film starts */
  #load .rail, #load-say { transition: opacity .4s; }
  body.loaded #load .rail, body.loaded #load-say { opacity: 0; }
  body.loaded #start { transform: translateY(96px); }
  body.playing #load, body.done #load { opacity: 0; pointer-events: none; }
  body.still #load { display: none; }
  #start:disabled { visibility: hidden; }
  @media (prefers-reduced-motion: reduce) { #load .rail::after { animation: none; } #load-bar { transition: none; } }
  #dbg { position: fixed; left: 10px; top: 8px; font: 600 13px/1 ui-monospace, monospace; color: #fff; background: rgba(0, 0, 0, .55); padding: 6px 8px; border-radius: 6px; pointer-events: none; }
</style>
<script type="importmap">{ "imports": { "three": "../vendor/three/three.module.js", "three/addons/": "../vendor/" } }</script>
</head>
<body>
<canvas id="op" aria-label="Amakawa opening animation"></canvas>
<div id="load" role="status" aria-live="polite"><div class="kanji">天川</div><div class="word">AMAKAWA</div><div class="rail"><div id="load-bar"></div></div><div id="load-say">Loading the opening</div></div>
<button id="start" type="button" disabled><i aria-hidden="true"></i>Play the opening</button>
<div id="bar"><button id="lyrics" type="button" aria-pressed="true">Lyrics on</button><button id="skip" type="button">Skip</button></div>
<script type="module" src="./op.js"></script>
</body>
</html>
