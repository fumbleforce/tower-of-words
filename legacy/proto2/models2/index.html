<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Image models, round 2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap">
<style>
body { margin: 0; background: #f5f6f8; color: #15171c; font: 16px/1.5 "Outfit", sans-serif; }
main { max-width: 1400px; margin: 0 auto; padding: 28px 20px 60px; }
h1 { margin: 0 0 4px; font-size: 26px; } .intro { color: #4b5260; margin: 0 0 20px; max-width: 800px; }
.model { background: #fff; border: 1px solid #dadee4; border-radius: 8px; padding: 14px; margin-bottom: 14px; }
.model h2 { margin: 0; font-size: 19px; } .model p { margin: 2px 0 10px; color: #4b5260; font-size: 15px; }
.imgs { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
.imgs figure { margin: 0; } .imgs img { width: 100%; border-radius: 6px; display: block; }
.imgs figcaption { font-size: 12px; color: #4b5260; line-height: 1.3; margin-top: 2px; }
@media (max-width: 900px) { .imgs { grid-template-columns: repeat(4, 1fr); } }
</style></head><body><main>
<h1>Four models, four anime styles, eight characters</h1>
<p class="intro">Every prompt is one short sentence of style plus one of character. Each style draws a different pair of characters, so every column pair is one style. Tell me the model, style or single images you like.</p>
<div id="list"></div>
<script>
const M = [
  ['seedream', 'Seedream 4.5 (ByteDance)', 'Its 1990s cel versions (Sayaka, Tomi) are the strongest in the whole test. It read "visual novel sprite" as pixel art, so ignore the last two. About $0.04.'],
  ['flux', 'FLUX 2 Pro', 'Short prompts took away most of the glossy look. Good 1990s cel, clean TV style. About $0.03.'],
  ['hunyuan', 'Hunyuan Image 3 (Tencent)', 'Highest detail and the most expressive faces. Its seinen Rei turned vampish, with red eyes and lipstick. About $0.08.'],
  ['minimax', 'MiniMax Image-01', 'Flatter and less consistent from style to style, but it can take a reference image to keep a character the same. About $0.01.'],
];
const COLS = [['tv-mio', 'TV: Mio'], ['tv-daigo', 'TV: Daigo'], ['seinen-reiB', 'Seinen: Rei (bob)'], ['seinen-guard', 'Seinen: guard'], ['cel90s-sayaka', '90s cel: Sayaka'], ['cel90s-tomi', '90s cel: Tomi'], ['vn-hana', 'VN sprite: Hana'], ['vn-rei', 'VN sprite: Rei']];
const list = document.getElementById('list');
for (const [k, name, note] of M) {
  const el = document.createElement('section'); el.className = 'model';
  el.innerHTML = `<h2>${name}</h2><p>${note}</p><div class="imgs">` + COLS.map(([f, c]) => `<figure><img src="${k}-${f}.webp" alt="${c}" loading="lazy"><figcaption>${c}</figcaption></figure>`).join('') + '</div>';
  list.append(el);
}
</script></main></body></html>
