<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Noto+Sans+JP:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<style>
  :root { --bg: #14181f; --panel: #1b2029; --line: #2a313d; --text: #dfe3ea; --dim: #8f98a8; --teal: #3fc1b0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.6 Geist, "Noto Sans JP", system-ui, sans-serif; }
  body { display: grid; grid-template-columns: 260px 1fr; }
  nav { border-right: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 12px 8px; }
  nav h4 { margin: 14px 8px 4px; color: var(--dim); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
  nav a { display: block; color: var(--dim); text-decoration: none; padding: 5px 8px; border-radius: 6px; font-size: 14px; }
  nav a:hover, nav a.on { color: var(--text); background: #232a35; }
  main { overflow-y: auto; padding: 24px 32px 80px; }
  article { max-width: 820px; }
  article a { color: var(--teal); }
  article table { border-collapse: collapse; margin: 12px 0; font-size: 14px; }
  article th, article td { border: 1px solid var(--line); padding: 5px 9px; vertical-align: top; }
  article code { background: #232a35; padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  article pre { background: #1b2029; padding: 12px; border-radius: 8px; overflow-x: auto; }
  article h1, article h2 { border-bottom: 1px solid var(--line); padding-bottom: 4px; }
  @media (max-width: 720px) { body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } nav { max-height: 34vh; border-right: 0; border-bottom: 1px solid var(--line); } main { padding: 16px; } }
</style>
</head>
<body>
<nav id="nav"></nav>
<main><article id="doc">Pick a note.</article></main>
<script>
  // Folders are read from the dev server's directory listings, so new notes show up by themselves.
  const groups = [
    ['Notes', '../notes/', /\.md$/],
    ['Walkthrough', '../notes/walkthrough/', /\.md$/],
    ['Story', '../game3d/story/', /\.md$/],
    ['Game design', '../game3d/design/', /\.md$/],
  ];
  const nav = document.getElementById('nav'), doc = document.getElementById('doc');
  async function list(dir, re) {
    try {
      const html = await (await fetch(dir)).text();
      return [...html.matchAll(/href="([^"?#]+)"/g)].map(m => decodeURIComponent(m[1])).filter(f => re.test(f)).sort();
    } catch { return []; }
  }
  async function open(path, link) {
    nav.querySelectorAll('a').forEach(a => a.classList.toggle('on', a === link));
    const md = await (await fetch(path)).text();
    doc.innerHTML = marked.parse(md);
    const base = path.slice(0, path.lastIndexOf('/') + 1);
    doc.querySelectorAll('a[href$=".md"]').forEach(a => {
      const target = new URL(a.getAttribute('href'), new URL(base, location.href)).pathname;
      a.onclick = e => { e.preventDefault(); location.hash = target; };
    });
    document.querySelector('main').scrollTop = 0;
  }
  (async () => {
    // The repo root serves index.html, so its docs are listed by name.
    nav.insertAdjacentHTML('beforeend', '<a class="hub" href="../">← Hub</a><h4>Working docs</h4>');
    for (const f of ['GUIDE.md', 'TODO.md', 'README.md']) {
      const a = document.createElement('a');
      a.textContent = f.replace(/\.md$/, ''); a.href = '#' + new URL('../' + f, location.href).pathname;
      nav.appendChild(a);
    }
    // Each notes/ subfolder gets its own group after Notes (research/, architecture/, ...); the logs stay out.
    const skip = new Set(['walkthrough/', 'feedback-log/', 'feedback-game/']);
    const subs = (await list('../notes/', /^[^/]+\/$/)).filter(d => !skip.has(d));
    groups.splice(1, 0, ...subs.map(d => [`Notes: ${d.slice(0, -1)}`, `../notes/${d}`, /\.md$/]));
    for (const [title, dir, re] of groups) {
      const files = await list(dir, re);
      if (!files.length) continue;
      nav.insertAdjacentHTML('beforeend', `<h4>${title}</h4>`);
      for (const f of files) {
        const a = document.createElement('a');
        const path = new URL(dir + f, location.href).pathname;
        a.textContent = f.replace(/\.md$/, ''); a.href = '#' + path;
        nav.appendChild(a);
      }
    }
    const pick = () => {
      const p = decodeURIComponent(location.hash.slice(1));
      const link = [...nav.querySelectorAll('a[href^="#"]')].find(a => a.hash.slice(1) === p) || nav.querySelector('a[href^="#"]');
      if (link) open(link.hash.slice(1), link);
    };
    addEventListener('hashchange', pick);
    pick();
  })();
</script>
</body>
</html>
