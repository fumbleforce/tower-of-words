<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Mio: generated volume guides</title>
  <script type="importmap">{"imports":{"three":"/game3d/vendor/three/three.module.js","three/addons/":"/game3d/vendor/"}}</script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.4 system-ui, sans-serif; color: #1d2327; background: #f6f7f8; }
    header { padding: 14px 18px 6px; }
    h1 { font-size: 19px; margin: 0 0 4px; }
    p { margin: 0; }
    header p, #status { color: #5d676e; }
    .bar { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 18px; align-items: center; }
    button, select { font: inherit; padding: 6px 10px; border: 1px solid #d7dde1; border-radius: 6px; background: white; color: inherit; }
    button[aria-pressed="true"] { background: #13796d; color: white; }
    .stage { display: grid; grid-template-columns: 1fr 1fr; }
    #view, .stage img { display: block; width: 100%; height: min(72vh, 760px); background: #e5e8ec; }
    #view { touch-action: none; cursor: grab; }
    .stage img { object-fit: contain; }
    #status { padding: 6px 18px; }
    @media (max-width: 700px) { .stage { grid-template-columns: 1fr; } }
  </style>
  <link rel="stylesheet" href="./viewer-kit.css">
  <style>
    #target-toggle { display: none; }
    @media (max-width: 700px) {
      #target-toggle { display: inline-block; }
      .stage { grid-template-rows: 100%; overflow: hidden; }
      .stage #target { display: none; height: 100%; object-fit: contain; }
      .stage.show-target #view { display: none; }
      .stage.show-target #target { display: block; }
    }
  </style>
</head>
<body>
  <header><h1>Mio: generated volume guides</h1><p>Raw results beside the target picture. Drag to turn, pinch or scroll to zoom. These are unrigged modelling guides; no character rebuild is finished.</p></header>
  <div class="bar"><label for="source">Guide</label><select id="source">
    <option value="meshy-single">Meshy: one picture</option>
    <option value="meshy-multi-t3">Meshy: four pictures</option>
    <option value="triposg-single">TripoSG: one picture, clay</option>
  </select></div>
  <div class="bar">
    <button id="target-toggle" aria-pressed="false" aria-controls="target">Target picture</button>
    <button data-yaw="0">Front</button><button data-yaw="40">Three-quarter</button>
    <button data-yaw="90">Side</button><button data-yaw="180">Back</button>
    <button id="clay" aria-pressed="false">Clay</button><button id="reset">Reset zoom</button>
  </div>
  <div class="stage"><canvas id="view" aria-label="Rotatable generated model"></canvas><img id="target" src="/art/parts/style-concepts/mio-ref-clean/final.png" alt="The target picture"></div>
  <p id="status" role="status" aria-live="polite">Loading…</p>
  <script type="module" src="./mio-gen3d-viewer.js"></script>
</body>
</html>
