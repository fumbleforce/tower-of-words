<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Character faces (char-face-1) · live</title>
<script type="importmap">{"imports":{"three":"/game3d/vendor/three/three.module.js","three/addons/":"/game3d/vendor/"}}</script>
<style>
  :root { --ink: #1d2327; --muted: #5d676e; --line: #d7dde1; --teal: #13796d; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.4 system-ui, sans-serif; color: var(--ink); background: #f6f7f8; }
  header { padding: 14px 18px 6px; }
  h1 { font-size: 19px; margin: 0 0 4px; }
  header p { margin: 0; color: var(--muted); }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 18px; align-items: center; }
  button, select { font: inherit; padding: 6px 12px; border: 1px solid var(--line); border-radius: 6px; background: #fff;
    color: var(--ink); cursor: pointer; }
  button[aria-pressed="true"] { background: var(--teal); border-color: var(--teal); color: #fff; }
  #view { width: 100%; height: min(72vh, 760px); display: block; touch-action: none; cursor: grab; background: #e5e8ec; }
  #status { padding: 6px 18px; color: var(--muted); }
</style></head><body>
<header><h1>Faceted bodies with anime faces</h1>
<p>Mio (left) and Eric (right). Drag to turn them, scroll or pinch to zoom. Pick an attempt, a motion and an expression.</p></header>
<div class="bar" id="concepts" aria-label="Concept"></div>
<div class="bar" aria-label="Motion">
  <button data-clip="idle" aria-pressed="true">Idle</button><button data-clip="walk">Walk</button>
  <button data-clip="">Rest pose</button><button id="spin">Turntable</button>
  <button data-yaw="0">Front</button><button data-yaw="40">Three-quarter</button><button data-yaw="90">Side</button>
  <button data-yaw="180">Back</button>
</div>
<div class="bar" aria-label="Expression">
  <button data-expr="0" aria-pressed="true">Neutral</button><button data-expr="1">Mio smile · Eric surprised</button>
  <button id="face">Close-up: off</button>
</div>
<canvas id="view"></canvas>
<p id="status" role="status" aria-live="polite">Loading…</p>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const list = (await (await fetch('./face_attempts.json')).json()).attempts;
const EXPRS = { mio: ['neutral', 'smile'], eric: ['neutral', 'surprised'] };
let expr = 0, close = 0;
const texLoader = new THREE.TextureLoader();
const q = new URLSearchParams(location.search);
let current = list.find((c) => c.id === q.get('c')) || list[0];
let clip = 'idle', spin = false, yaw = 0, pitch = 0.12, dist = 3.4;
const canvas = document.getElementById('view');
const r = new THREE.WebGLRenderer({ canvas, antialias: true });
r.setPixelRatio(Math.min(devicePixelRatio, 2));
r.outputColorSpace = THREE.SRGBColorSpace;
r.shadowMap.enabled = true;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#e5e8ec');
scene.add(new THREE.HemisphereLight('#f4f6fa', '#9a958e', 1.6));
const sun = new THREE.DirectionalLight('#fff4e6', 2.4);
sun.position.set(-2, 4, 3); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.015;
Object.assign(sun.shadow.camera, { left: -2, right: 2, top: 2, bottom: -2 });
scene.add(sun);
const floor = new THREE.Mesh(new THREE.CircleGeometry(3, 48), new THREE.ShadowMaterial({ opacity: 0.25 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const cam = new THREE.PerspectiveCamera(24, 1, 0.05, 50);
const turn = new THREE.Group(); scene.add(turn);
const loader = new GLTFLoader();
let mixers = [], loaded = [], loadId = 0, fitDist = dist;
const status = document.getElementById('status');

function disposeModel(model) {
  model.traverse((o) => {
    if (!o.isMesh) return;
    o.geometry.dispose();
    for (const m of [o.material].flat()) m.dispose();
  });
}
function fitPair(resetZoom = false) {
  if (!turn.children.length) return;
  const size = new THREE.Box3().setFromObject(turn).getSize(new THREE.Vector3());
  const radius = Math.hypot(size.x, size.z) / 2;
  const tanHalfFov = Math.tan(THREE.MathUtils.degToRad(cam.fov) / 2);
  const aspect = canvas.clientWidth / canvas.clientHeight;
  const zoom = resetZoom ? 1 : dist / fitDist;
  fitDist = Math.max(2.4, (Math.max(size.y / (2 * tanHalfFov), radius / (tanHalfFov * aspect)) + radius) * 1.08);
  dist = fitDist * zoom;
}
async function show(c) {
  const id = ++loadId;
  current = c;
  history.replaceState(null, '', '?c=' + c.id);
  for (const b of document.querySelectorAll('#concepts button')) b.setAttribute('aria-pressed', b.dataset.id === c.id);
  status.textContent = 'Loading ' + c.label + '…';
  loaded.forEach((g) => disposeModel(g.scene));
  turn.clear(); mixers = []; loaded = [];
  try {
    const gl = await Promise.all(['mio', 'eric'].map((n) => loader.loadAsync(c.dir + n + '.glb')));
    if (id !== loadId) { gl.forEach((g) => disposeModel(g.scene)); return; }
    gl.forEach((g, i) => {
      g.scene.position.x = i ? 0.33 : -0.33;
      g.scene.traverse((m) => {
        if (m.isMesh) m.castShadow = m.receiveShadow = true;
        m.userData.rest = [m.position.clone(), m.quaternion.clone(), m.scale.clone()];
      });
      turn.add(g.scene);
      const mx = new THREE.AnimationMixer(g.scene);
      mixers.push(mx); loaded.push(g);
    });
    fitPair(true);
    play(clip);
    setExpr(expr);
    status.textContent = c.label + (c.note ? ' · ' + c.note : '');
  } catch (e) { if (id === loadId) status.textContent = 'Could not load ' + c.label + ': ' + e.message; }
}
function setExpr(i) {
  expr = i;
  for (const b of document.querySelectorAll('[data-expr]')) b.setAttribute('aria-pressed', +b.dataset.expr === i);
  if (!current.faces) return;
  loaded.forEach((g, n) => {
    const ch = n ? 'eric' : 'mio';
    g.scene.traverse((m) => {
      if (!m.isMesh || m.material.name !== 'face-' + ch) return;
      const old = m.material.map;
      texLoader.load(current.dir + `face-${ch}-${EXPRS[ch][i]}.png`, (t) => {
        t.colorSpace = THREE.SRGBColorSpace; t.flipY = false;
        if (old) { t.wrapS = old.wrapS; t.wrapT = old.wrapT; }
        m.material.map = t; m.material.needsUpdate = true;
      });
    });
  });
}
document.querySelectorAll('[data-expr]').forEach((b) => (b.onclick = () => setExpr(+b.dataset.expr)));
document.getElementById('face').onclick = (e) => {
  close = (close + 1) % 3;
  e.target.textContent = 'Close-up: ' + ['off', 'Mio', 'Eric'][close];
  e.target.setAttribute('aria-pressed', close > 0);
};
function play(name) {
  clip = name;
  for (const b of document.querySelectorAll('[data-clip]')) b.setAttribute('aria-pressed', b.dataset.clip === name);
  loaded.forEach((g, i) => {
    mixers[i].stopAllAction();
    const a = g.animations.find((x) => x.name === name);
    if (a) mixers[i].clipAction(a).play();
    else g.scene.traverse((o) => {
      const [p, qu, sc] = o.userData.rest;
      o.position.copy(p); o.quaternion.copy(qu); o.scale.copy(sc);
    });
  });
}
for (const c of list) {
  const b = document.createElement('button');
  b.textContent = c.label; b.dataset.id = c.id; b.onclick = () => show(c);
  document.getElementById('concepts').append(b);
}
for (const b of document.querySelectorAll('[data-clip]')) b.onclick = () => play(b.dataset.clip);
for (const b of document.querySelectorAll('[data-yaw]')) b.onclick = () => { spin = false; yaw = (+b.dataset.yaw * Math.PI) / 180; };
document.getElementById('spin').onclick = (e) => { spin = !spin; e.target.setAttribute('aria-pressed', spin); };
let drag = null;
canvas.onpointerdown = (e) => { drag = [e.clientX, e.clientY]; canvas.setPointerCapture(e.pointerId); };
canvas.onpointermove = (e) => {
  if (!drag) return;
  yaw -= (e.clientX - drag[0]) * 0.01; pitch = Math.min(1.2, Math.max(-0.2, pitch + (e.clientY - drag[1]) * 0.006));
  drag = [e.clientX, e.clientY];
};
canvas.onpointerup = () => (drag = null);
canvas.onwheel = (e) => { e.preventDefault(); dist = Math.min(8, Math.max(0.5, dist * (1 + e.deltaY * 0.001))); };
const clock = new THREE.Clock();
function frame() {
  const dt = clock.getDelta();
  if (spin) yaw += dt * 0.6;
  mixers.forEach((m) => m.update(dt));
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== Math.round(w * r.getPixelRatio()) || canvas.height !== Math.round(h * r.getPixelRatio())) {
    r.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); fitPair();
  }
  turn.rotation.y = -yaw;
  loaded.forEach((g, i) => {
    g.scene.visible = !close || close === i + 1;
    g.scene.position.x = close ? 0 : i ? 0.33 : -0.33;
  });
  const box = new THREE.Box3().setFromObject(close ? loaded[close - 1].scene : turn);
  const cy = box.isEmpty() ? 0.6 : close ? box.max.y - (box.max.y - box.min.y) * 0.13 : (box.min.y + box.max.y) / 2;
  const d = close ? (box.max.y - box.min.y) * 1.0 : dist;
  cam.position.set(0, cy + Math.sin(pitch) * d, Math.cos(pitch) * d);
  cam.lookAt(0, cy, 0);
  r.render(scene, cam);
  requestAnimationFrame(frame);
}
show(current);
frame();
</script></body></html>
