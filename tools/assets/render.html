<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Asset thumbnails</title>
<script type="importmap">{ "imports": { "three": "../../game3d/vendor/three/three.module.js", "three/addons/": "../../game3d/vendor/" } }</script>
<style>html, body { margin: 0; background: #1d232d; } #s { width: 480px; height: 480px; }</style>
</head>
<body>
<div id="s"></div>
<script type="module">
// Driven by tools/assets/render3d.mjs: window.renderThumb(view) builds one asset with the game's code, poses it,
// and returns a WebP data URL. Rooms are built once and reused for every prop inside them.
import { buildAsset, Stage } from './viewer.js';
const stage = new Stage(document.getElementById('s'), { width: 480, height: 480, pixelRatio: 1 });
const rooms = {};
window.renderThumb = async (view) => {
  let b;
  if (view.type === 'room') {
    rooms[view.room] = rooms[view.room] || buildAsset({ type: 'room', room: view.room });
    b = await rooms[view.room];
    b.focus = view.anchor ? { anchor: view.anchor, spot: view.spot, small: view.small } : null;
  } else {
    b = await buildAsset(view);
  }
  stage.show(b);
  stage.auto = false;
  if (!b.scene) { stage.yaw = 0.45; stage.place(); }
  // let the pose settle: walks mid-stride, gestures near their peak
  const t = view.gesture ? 1.3 : view.play === 'walk' || view.play === 'run' ? 0.45 : 0.2;
  for (let i = 0; i < Math.round(t * 30); i++) b.update(1 / 30);
  await new Promise((r) => setTimeout(r, 30));
  stage.step(0);
  const url = stage.r.domElement.toDataURL('image/webp', 0.86);
  if (!b.scene && b.object.parent) b.object.parent.remove(b.object);
  return url;
};
window.ready = true;
</script>
</body>
</html>
