<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Image gen · Amakawa</title>
<link rel="stylesheet" href="/tools/subplots/web/editor.css">
<link rel="stylesheet" href="/tools/subplots/web/images.css">
<link rel="stylesheet" href="/web/studio.css">
</head>
<body class="image-studio">
<script src="http://127.0.0.1:8771/tools/nav/nav.js"></script>
<header class="studio-top">
  <div class="brand">Amakawa <span>Image gen</span></div>
  <nav class="studio-nav" aria-label="Image workspace"><a href="#studioPrompt">Compose</a><a href="#renders">Picture library</a></nav>
  <div id="gpu" class="studio-gpu" role="status">Checking GPU…</div>
</header>
<main id="images" class="studio-workspace compose-dialog">
  <details class="studio-controls" open><summary class="studio-controls-toggle"><span>Composition</span><span class="studio-controls-cue" aria-hidden="true"></span></summary><div class="studio-controls-body"><div class="studio-controls-head"><h1>Composition</h1><button type="button" id="loadPresets" class="small ghost">Refresh presets</button></div><div class="studio-mode"></div><div id="composition"></div></div></details>
  <section class="studio-canvas" aria-label="Image workspace">
    <div class="studio-status"><span id="imageStatus" class="quiet" role="status">Loading image controls…</span><span id="draftStatus" class="hint">Draft saved in this browser</span><a href="/legacy">Earlier interface</a></div>
    <div id="composePreview" class="studio-direction-controls"></div>
    <div id="studioPlacePreview" class="studio-place-preview" hidden></div>
    <div id="studioPrompt"></div>
    <div id="notice" class="studio-notice" role="status" hidden></div>
    <div id="studioSelection" class="studio-selection" hidden></div>
    <div id="studioQueue" class="studio-queue" hidden></div>
    <div id="renders"></div>
  </section>
</main>
<script type="module" src="/web/studio.js"></script>
</body>
</html>
