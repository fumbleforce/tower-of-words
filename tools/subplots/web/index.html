<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Scene editor · Amakawa</title>
<link rel="stylesheet" href="editor.css">
<link rel="stylesheet" href="preview.css">
<link rel="stylesheet" href="images.css">
<link rel="stylesheet" href="versions.css">
</head>
<body>
<script src="../../nav/nav.js"></script>
<header class="top">
  <div class="brand">Amakawa <span>Scene editor</span></div>
  <div class="doc" id="doc" hidden>
    <div class="doc-title"><span id="docArea" class="doc-area"></span><h1 id="docTitle"></h1></div>
    <div class="doc-meta"><span id="docAudience" class="tag"></span><span id="docStatus" class="doc-status"></span><span id="docWhere" class="where"></span></div>
  </div>
  <div class="status" id="status" role="status"></div>
  <div class="actions">
    <button id="undo" class="icon" title="Undo (Ctrl+Z)" disabled>Undo</button>
    <button id="redo" class="icon" title="Redo (Ctrl+Shift+Z)" disabled>Redo</button>
    <span class="sep"></span>
    <button id="preview" disabled title="Play the scene here, in the game's dialogue style (P)">Preview</button>
    <a id="play" class="button" target="_blank" rel="noopener" aria-disabled="true">Play in game</a>
    <button id="save" class="primary" disabled title="Save to the story (Ctrl+S)">Save</button>
  </div>
</header>
<div id="banner" class="banner" hidden></div>
<main class="work">
  <nav class="scenes" aria-label="Scenes">
    <div class="scenes-head">
      <input id="search" type="search" placeholder="Find a scene, place or person" aria-label="Find a scene">
      <div class="seg" id="filter" role="group" aria-label="Show">
        <button data-filter="all" aria-pressed="true">All</button>
        <button data-filter="public" aria-pressed="false">Public game</button>
        <button data-filter="private" aria-pressed="false">Private</button>
      </div>
      <div class="day-pick"><span>Day</span><div class="seg days" id="days" role="group" aria-label="Story day"></div></div>
      <div class="head-actions"><button id="mapToggle" class="map-toggle" aria-pressed="false" title="The day's scenes by place and time of day">Map of the day</button><button id="newScene" title="A new public scene from a template">+ New scene</button></div>
    </div>
    <div id="sceneList" class="scene-list"><p class="quiet pad">Reading the scenes…</p></div>
    <div class="scenes-foot"><a href="http://127.0.0.1:8772/" target="_blank" rel="noopener">Image generator</a><a href="/bible/" target="_blank" rel="noopener">World bible</a></div>
  </nav>
  <section class="timeline-wrap" aria-label="Scene timeline">
    <div id="empty" class="empty">
      <h2>Open a scene</h2>
      <p>Pick one on the left. Public game scenes and private scenes are both here, each labelled with where it lives.</p>
    </div>
    <div id="timeline" class="timeline" hidden></div>
    <div id="board" class="board" hidden></div>
  </section>
  <aside class="inspector" aria-label="Details">
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="beat" aria-selected="true">Beat</button>
      <button role="tab" data-tab="picture" aria-selected="false">Picture</button>
      <button role="tab" data-tab="scene" aria-selected="false">Scene</button>
    </div>
    <div id="tabBeat" class="tab-body"></div>
    <div id="tabPicture" class="tab-body" hidden></div>
    <div id="tabScene" class="tab-body" hidden></div>
  </aside>
</main>
<div id="pop" class="pop" hidden></div>
<dialog id="newDialog" class="new-dialog" aria-label="New scene"></dialog>
<dialog id="previewDialog" class="preview-dialog" aria-label="Scene preview"></dialog>
<dialog id="compareDialog" class="compare-dialog" aria-label="Compare versions of a picture"></dialog>
<dialog id="composeDialog" class="compose-dialog" aria-label="Compose a new picture">
  <div class="compose-head"><h2>Compose a new picture <span id="composeFor" class="compose-for"></span></h2><span id="imageStatus" class="quiet"></span><button id="closeCompose">Done</button></div>
  <div class="compose-body"><div id="composition" class="compose-col"></div><div id="composePreview" class="compose-col compose-stage"></div><div class="compose-col compose-side"><div id="composeShot"></div><div id="renders" class="compose-library"></div></div></div>
</dialog>
<script type="module" src="app.js"></script>
</body>
</html>
