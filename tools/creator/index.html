<!doctype html>
<html lang="en"><head>
<meta name="robots" content="noindex, nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Character creator</title>
<script type="importmap">{"imports":{"three":"/game3d/vendor/three/three.module.js","three/addons/":"/game3d/vendor/"}}</script>
<style>
  :root { --bg: #e9ecf1; --panel: #ffffff; --ink: #1b2130; --mute: #5d6678; --line: #d5dae3; --accent: #2f6fde; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #151923; --panel: #1f2533; --ink: #e8ecf3; --mute: #9aa4b8; --line: #323a4c; --accent: #6d9cff; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .app { display: grid; grid-template-columns: 1fr 340px; height: 100%; }
  #view { position: relative; min-height: 0; }
  #view canvas { display: block; width: 100%; height: 100%; }
  .bar { position: absolute; left: 16px; bottom: 16px; display: flex; gap: 6px; }
  .bar button, .panel button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 7px 12px; cursor: pointer; }
  .bar button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .panel { background: var(--panel); border-left: 1px solid var(--line); padding: 16px; overflow-y: auto; }
  h1 { font-size: 17px; margin: 0 0 12px; }
  .slot { display: grid; grid-template-columns: 64px 1fr 40px; gap: 8px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line); }
  .slot label { color: var(--mute); }
  select { font: inherit; width: 100%; padding: 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
  input[type=color] { width: 40px; height: 32px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none; }
  .swatches { grid-column: 2 / 4; display: flex; gap: 5px; flex-wrap: wrap; }
  .swatches button { width: 26px; height: 26px; padding: 0; border-radius: 50%; }
  .swatches button[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 2px; }
  .recipe-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .recipe-actions button { min-height: 44px; }
  .panel button:disabled { opacity: .55; cursor: default; }
  #recipe-status { min-height: 1.4em; color: var(--mute); }
  details { margin-top: 12px; }
  #fit-controls fieldset { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: center; padding: 12px 0; margin: 0; border: 0; }
  #fit-controls input { width: 100%; min-height: 40px; font: inherit; padding: 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); }
  #fit-controls button { grid-column: 1 / -1; min-height: 44px; }
  textarea { width: 100%; height: 130px; font: 12px/1.35 ui-monospace, monospace; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); padding: 8px; margin-top: 8px; }
  .note { color: var(--mute); font-size: 12px; margin-top: 10px; }
  #status { position: absolute; top: 16px; left: 16px; color: var(--mute); }
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 52vh auto; height: auto; }
    #view { position: sticky; top: 0; z-index: 1; background: var(--bg); }
    .panel { border-left: 0; border-top: 1px solid var(--line); }
  }
</style></head>
<body>
<div class="app">
  <div id="view"><div id="status">Loading parts…</div>
    <div class="bar"><button data-anim="idle" aria-pressed="true">Idle</button><button data-anim="walk" aria-pressed="false">Walk</button><button id="spin" aria-pressed="false">Auto-turn</button></div>
  </div>
  <div class="panel">
    <h1>Character creator</h1>
    <div class="slot"><label for="body">Body</label><select id="body"></select><span></span></div>
    <div id="slots"></div>
    <details id="fit-controls"></details>
    <div class="recipe-actions"><button id="save-recipe" disabled>Save recipe</button><button id="load-recipe" disabled>Load recipe</button></div>
    <div class="recipe-actions"><button id="export-glb" disabled>Export GLB</button></div>
    <input id="recipe-file" type="file" accept=".json,application/json" hidden>
    <p id="recipe-status" role="status" aria-live="polite"></p>
    <details><summary>Recipe JSON</summary><textarea id="recipe" spellcheck="false" aria-label="Recipe JSON"></textarea>
    <div class="recipe-actions"><button id="apply-recipe" disabled>Apply JSON</button><button id="copy" disabled>Copy JSON</button></div></details>
    <p class="note">Experiment. Parts cut from Mio and Eric, on one skeleton. The body sets the proportions; parts from the other model are stretched to fit it.</p>
  </div>
</div>
<script type="module">
import * as THREE from 'three';
import { loadLibrary, buildCharacter, setColours, SLOTS, SKIN_TONES } from './recipe.js';
import { disposeCharacter } from './dispose.js';
import { parseRecipe, recipeFile, MAX_RECIPE_BYTES } from './recipe-file.js';
import { createFitControls } from './fit-controls.js';

const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.outputColorSpace = THREE.SRGBColorSpace;
view.prepend(renderer.domElement);
const scene = new THREE.Scene();
const bg = () => getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
scene.background = new THREE.Color(bg());
scene.add(new THREE.HemisphereLight(0xffffff, 0x8f98ab, 2.0));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(1.5, 3, 2.5); scene.add(sun);
const floor = new THREE.Mesh(new THREE.CircleGeometry(0.7, 48), new THREE.MeshLambertMaterial({ color: 0xc9cfda })); floor.rotation.x = -Math.PI / 2; scene.add(floor);
const cam = new THREE.PerspectiveCamera(28, 1, 0.05, 50);
function resize() { const w = view.clientWidth, h = view.clientHeight; renderer.setSize(w, h, false); cam.aspect = w / h; cam.position.set(0, 0.75, w < h ? 4.4 : 3.6); cam.lookAt(0, 0.55, 0); cam.updateProjectionMatrix(); }
addEventListener('resize', resize);

const lib = await loadLibrary();
const bySlot = {}; for (const p of lib.parts) (bySlot[p.slot] = bySlot[p.slot] || []).push(p);
const recipe = { body: 'mio', parts: {}, colours: {}, height: 1.1 };
for (const s of SLOTS) recipe.parts[s] = `mio-${s}`;
const params = new URLSearchParams(location.search);
let initialRecipeError = '';
if (params.get('recipe')) {
  try { Object.assign(recipe, parseRecipe(params.get('recipe'), lib)); }
  catch (error) { initialRecipeError = 'Could not load URL recipe: ' + error.message; }
}

const bodySel = document.getElementById('body');
bodySel.innerHTML = Object.keys(lib.sources).map((k) => `<option value="${k}">${k[0].toUpperCase() + k.slice(1)}</option>`).join('');
bodySel.value = recipe.body;
bodySel.onchange = () => { recipe.body = bodySel.value; rebuild(); };
const slotsEl = document.getElementById('slots');
const label = (p) => p.source[0].toUpperCase() + p.source.slice(1) + '’s ' + p.slot;
for (const s of SLOTS) {
  const row = document.createElement('div'); row.className = 'slot';
  const opts = (bySlot[s] || []).map((p) => `<option value="${p.id}">${label(p)}</option>`).join('');
  const tintable = s !== 'head' && s !== 'hands';
  row.innerHTML = `<label for="s-${s}">${s[0].toUpperCase() + s.slice(1)}</label><select id="s-${s}">${opts}</select>` + (tintable ? `<input type="color" id="c-${s}" aria-label="${s} colour">` : '<span></span>');
  slotsEl.append(row);
  const sel = row.querySelector('select'); sel.value = recipe.parts[s];
  sel.onchange = () => { recipe.parts[s] = sel.value; rebuild(); };
  if (tintable) {
    const c = row.querySelector('input'); const p = lib.byId[recipe.parts[s]];
    c.value = '#' + p.key.map((x) => x.toString(16).padStart(2, '0')).join('');
    c.oninput = () => { recipe.colours[s] = c.value; if (ch) setColours(ch, recipe.colours); showRecipe(); };
  }
  if (s === 'hands') {
    const sw = document.createElement('div'); sw.className = 'slot';
    sw.innerHTML = '<label>Skin</label><div class="swatches"><button aria-pressed="true" title="As made" style="background:conic-gradient(#f7e3d8 0 50%, #f3d3c0 0)"></button>' + SKIN_TONES.map((t) => `<button aria-pressed="false" data-tone="${t}" style="background:${t}" title="${t}"></button>`).join('') + '</div>';
    slotsEl.append(sw);
    sw.querySelectorAll('button').forEach((b) => b.onclick = () => {
      sw.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', 'false')); b.setAttribute('aria-pressed', 'true');
      if (b.dataset.tone) recipe.colours.skin = b.dataset.tone; else delete recipe.colours.skin;
      if (ch) setColours(ch, recipe.colours); showRecipe();
    });
  }
}
const fitControls = createFitControls(document.getElementById('fit-controls'), recipe, () => rebuild());
function showRecipe() { document.getElementById('recipe').value = JSON.stringify(recipe, null, 1); }
function syncRecipeControls() {
  fitControls.sync();
  bodySel.value = recipe.body;
  for (const slot of SLOTS) {
    document.getElementById('s-' + slot).value = recipe.parts[slot];
    const colour = document.getElementById('c-' + slot);
    if (colour) colour.value = recipe.colours?.[slot] || '#' + lib.byId[recipe.parts[slot]].key.map(x => x.toString(16).padStart(2, '0')).join('');
  }
  document.querySelectorAll('.swatches button').forEach(button => button.setAttribute('aria-pressed', String((button.dataset.tone || '') === (recipe.colours?.skin || ''))));
}
const fileStatus = document.getElementById('recipe-status');
const fileInput = document.getElementById('recipe-file');
let exporting = false;
document.getElementById('export-glb').onclick = async () => {
  if (exporting) return;
  exporting = true;
  const button = document.getElementById('export-glb'); button.disabled = true;
  const snapshot = structuredClone(ch.recipe);
  snapshot.colours = structuredClone(recipe.colours);
  fileStatus.textContent = 'Exporting character…';
  try {
    const { exportCharacterGLB } = await import('./export-glb.js');
    const data = await exportCharacterGLB(lib, snapshot);
    const url = URL.createObjectURL(new Blob([data], {type: 'model/gltf-binary'}));
    const link = document.createElement('a'); link.href = url; link.download = snapshot.body + '-character.glb';
    document.body.append(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
    fileStatus.textContent = 'GLB exported with Idle and Walk. Lighting depends on the viewer.';
  } catch (error) { fileStatus.textContent = 'Could not export GLB: ' + error.message; }
  finally { exporting = false; button.disabled = !ch; }
};
function replaceRecipe(next) { for (const key of Object.keys(recipe)) delete recipe[key]; Object.assign(recipe, next); }
async function applyRecipeText(text) {
  const next = parseRecipe(text, lib), previous = structuredClone(recipe);
  replaceRecipe(next);
  fileStatus.textContent = 'Loading recipe…';
  const result = await rebuild();
  if (result === false) {
    replaceRecipe(previous); if (ch) setColours(ch, recipe.colours); syncRecipeControls(); showRecipe();
    fileStatus.textContent = 'Could not build this recipe. Your previous character is still shown.';
  } else if (result === true) fileStatus.textContent = 'Recipe loaded.';
}
document.getElementById('apply-recipe').onclick = async () => {
  try { await applyRecipeText(document.getElementById('recipe').value); }
  catch (error) { fileStatus.textContent = error.message; }
};
document.getElementById('load-recipe').onclick = () => fileInput.click();
fileInput.onchange = async () => {
  const file = fileInput.files[0]; if (!file) return;
  try {
    if (file.size > MAX_RECIPE_BYTES) throw new Error('Recipe must be smaller than 64 KB.');
    await applyRecipeText(await file.text());
  } catch (error) { fileStatus.textContent = error.message; }
  finally { fileInput.value = ''; }
};
document.getElementById('save-recipe').onclick = () => {
  const url = URL.createObjectURL(new Blob([recipeFile(recipe)], {type: 'application/json'}));
  const link = document.createElement('a'); link.href = url; link.download = recipe.body + '-recipe.json';
  document.body.append(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
  fileStatus.textContent = 'Recipe saved. Load this file to restore your character.';
};
document.getElementById('copy').onclick = async () => {
  try { await navigator.clipboard.writeText(document.getElementById('recipe').value); fileStatus.textContent = 'Recipe copied.'; }
  catch { fileStatus.textContent = 'Copy was unavailable. Select the JSON text and copy it manually.'; }
};

let ch = null, anim = 'idle', spin = false, busy = 0;
async function rebuild() {
  const my = ++busy;
  fitControls.setDisabled(true);
  document.querySelectorAll('.recipe-actions button').forEach(button => { button.disabled = true; });
  const status = document.getElementById('status'); status.textContent = 'Updating character…';
  try {
    const next = await buildCharacter(lib, structuredClone(recipe));
    if (my !== busy) { disposeCharacter(next); return; }
    next.recipe.colours = structuredClone(recipe.colours || {});
    setColours(next, next.recipe.colours);
    disposeCharacter(ch);
    ch = next; scene.add(ch.root); ch.play(anim, 0);
    status.textContent = '';
    syncRecipeControls(); showRecipe();
    return true;
  } catch (error) {
    if (my === busy) {
      if (ch) {
        const colours = structuredClone(recipe.colours || {});
        for (const key of Object.keys(recipe)) delete recipe[key];
        Object.assign(recipe, structuredClone(ch.recipe), {colours});
        document.getElementById('body').value = recipe.body;
        for (const slot of SLOTS) document.getElementById('s-' + slot).value = recipe.parts[slot];
        showRecipe();
      }
      status.textContent = 'Could not update character: ' + error.message;
      syncRecipeControls();
      return false;
    }
  } finally {
    if (my === busy) {
      fitControls.setDisabled(!ch);
      document.querySelectorAll('.recipe-actions button').forEach(button => { button.disabled = !ch; });
      document.getElementById('export-glb').disabled = !ch || exporting;
    }
  }
}
document.querySelectorAll('[data-anim]').forEach((b) => b.onclick = () => {
  anim = b.dataset.anim; document.querySelectorAll('[data-anim]').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); if (ch) ch.play(anim);
});
document.getElementById('spin').onclick = (e) => { spin = !spin; e.target.setAttribute('aria-pressed', String(spin)); };
// drag to turn
let drag = null, yaw = 0.5;
renderer.domElement.addEventListener('pointerdown', (e) => { drag = e.clientX; });
addEventListener('pointerup', () => { drag = null; });
addEventListener('pointermove', (e) => { if (drag !== null) { yaw += (e.clientX - drag) * 0.01; drag = e.clientX; } });

resize(); await rebuild();
if (initialRecipeError) fileStatus.textContent = initialRecipeError + ' Default character shown.';
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (spin && drag === null) yaw += dt * 0.5;
  if (ch) { ch.update(dt); ch.root.rotation.y = yaw; }
  renderer.render(scene, cam);
});
if (params.get('t')) { for (let i = 0; i < +params.get('t') * 30; i++) ch && ch.update(1 / 30); }
window.__done = 1;
</script>
</body></html>
