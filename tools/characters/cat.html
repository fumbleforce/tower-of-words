<!doctype html><html><head>
<meta name="robots" content="noindex, nofollow"><meta charset="utf-8">
<!-- The cat from people.js at several angles, as it sits in the lobby (scale 1.45, head/tail animation frames). -->
<script type="importmap">{ "imports": { "three": "../../game3d/vendor/three/three.module.js", "three/addons/": "../../game3d/vendor/" } }</script>
<style>html,body{margin:0;background:#9d978f}canvas{display:block}</style></head><body>
<script type="module">
import * as THREE from 'three';
import { cat } from '../../game3d/js/train/people.js';
const q = new URLSearchParams(location.search);
const angs = (q.get('a') || '0,40,90,180,270').split(',').map(Number), els = (q.get('el') || '56,20').split(',').map(Number);
const CW = 280, CH = 240, cols = angs.length, rows = els.length;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(CW * cols, CH * rows); document.body.appendChild(r.domElement);
r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.NeutralToneMapping; r.shadowMap.enabled = true; r.setScissorTest(true);
const s = new THREE.Scene(); s.background = new THREE.Color('#8c8f96');
s.add(new THREE.HemisphereLight('#d3def0', '#6a6a70', 2.0));
const sun = new THREE.DirectionalLight('#ffe2c0', 2.6); sun.position.set(-1.5, 4, 2); sun.castShadow = true; s.add(sun);
const fl = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), new THREE.MeshStandardMaterial({ color: '#b9bcc2' })); fl.rotation.x = -Math.PI / 2; fl.receiveShadow = true; s.add(fl);
const c = cat({ curl: !q.has('old') }); c.scale.setScalar(1.45); s.add(c);
const t = +(q.get('t') || 0.6);
c.userData.tail.rotation.y = Math.sin(t * 1.3) * 0.3; c.userData.head.rotation.x = 0.25 + Math.max(0, Math.sin(t * 2.2)) * 0.15;
const cam = new THREE.PerspectiveCamera(30, CW / CH, 0.05, 50);
els.forEach((el, j) => angs.forEach((a, i) => {
  const e = el * Math.PI / 180, A = a * Math.PI / 180, d = 1.25;
  cam.position.set(Math.sin(A) * Math.cos(e) * d, 0.12 + Math.sin(e) * d, Math.cos(A) * Math.cos(e) * d); cam.lookAt(0, 0.12, 0);
  const x = i * CW, y = (rows - 1 - j) * CH; r.setViewport(x, y, CW, CH); r.setScissor(x, y, CW, CH); r.render(s, cam);
}));
window.__done = true;
</script></body></html>
