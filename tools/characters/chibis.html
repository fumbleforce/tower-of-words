<!doctype html><html><head>
<meta name="robots" content="noindex, nofollow"><meta charset="utf-8">
<!-- The code-built chibis from cast.js (PEOPLE), in a row, front and three-quarter: ?ids=guard,kuroda,kenji,aoi,mori -->
<script type="importmap">{ "imports": { "three": "../../game3d/vendor/three/three.module.js", "three/addons/": "../../game3d/vendor/" } }</script>
<style>html,body{margin:0;background:#9d978f}canvas{display:block}</style></head><body>
<script type="module">
import * as THREE from 'three';
import { PEOPLE } from '../../game3d/js/cast.js';
const q = new URLSearchParams(location.search);
const ids = (q.get('ids') || 'guard,kuroda,kenji,aoi,mori').split(','), angs = (q.get('a') || '0,35').split(',').map(Number);
const CW = 260, CH = 340;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(CW * ids.length, CH * angs.length); document.body.appendChild(r.domElement);
r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.NeutralToneMapping; r.shadowMap.enabled = true; r.setScissorTest(true);
const s = new THREE.Scene(); s.background = new THREE.Color('#9d978f');
s.add(new THREE.HemisphereLight('#d3def0', '#8a7a68', 2.1));
const sun = new THREE.DirectionalLight('#ffe2c0', 2.6); sun.position.set(-1.5, 4, 3); sun.castShadow = true; s.add(sun);
const fl = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), new THREE.MeshStandardMaterial({ color: '#c9c2b8' })); fl.rotation.x = -Math.PI / 2; fl.receiveShadow = true; s.add(fl);
const cam = new THREE.PerspectiveCamera(24, CW / CH, 0.05, 50);
angs.forEach((a, j) => ids.forEach((id, i) => {
  const p = PEOPLE[id](); p.root.rotation.y = a * Math.PI / 180; s.add(p.root);
  cam.position.set(0, 1.0, 3.2); cam.lookAt(0, 0.55, 0);
  const x = i * CW, y = (angs.length - 1 - j) * CH; r.setViewport(x, y, CW, CH); r.setScissor(x, y, CW, CH); r.render(s, cam);
  s.remove(p.root);
}));
window.__done = true;
</script></body></html>
