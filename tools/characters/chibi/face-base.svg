<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-327.5 40 655 655" width="2048" height="2048">
  <!-- Face texture for the chibi base (tools/characters/chibi/build.py). The square covers the head's front:
       x = metres across x 1000 (0 = middle, her left = image right = +x), y = 1090 - height in mm, so it lines up
       with Jørgen's base picture's pixels (2026-10-02). Skin colour must equal SKIN in build.py. Her right eye is
       drawn once and mirrored; the catch-lights are not mirrored (one light, from image right). -->
  <defs>
    <filter id="soft" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="2.2"/></filter>
    <linearGradient id="iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f1f19"/>
      <stop offset="0.45" stop-color="#5a3d31"/>
      <stop offset="1" stop-color="#a9826d"/>
    </linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9c2bc"/>
      <stop offset="0.35" stop-color="#f2e4e0"/>
      <stop offset="1" stop-color="#f6ebe8"/>
    </linearGradient>
    <clipPath id="eyeclip">
      <path d="M -226 392 C -200 378 -130 370 -92 380 C -84 405 -86 450 -112 484 C -140 492 -175 490 -198 474 C -214 456 -224 420 -226 392 Z"/>
    </clipPath>
    <g id="eye">
      <!-- white -->
      <path d="M -226 392 C -200 378 -130 370 -92 380 C -84 405 -86 450 -112 484 C -140 492 -175 490 -198 474 C -214 456 -224 420 -226 392 Z" fill="url(#white)"/>
      <!-- iris and pupil, cut by the white's outline -->
      <g clip-path="url(#eyeclip)">
        <ellipse cx="-148" cy="431" rx="41" ry="57" fill="url(#iris)" stroke="#2c1d18" stroke-width="3.5"/>
        <ellipse cx="-147" cy="425" rx="14" ry="27" fill="#2a1a15" opacity="0.8"/>
        <!-- shadow of the lash on the top of the eye -->
        <path d="M -230 380 C -180 372 -120 368 -86 378 L -86 398 C -120 386 -180 388 -230 400 Z" fill="#3a2620" opacity="0.16"/>
      </g>
      <!-- lower lid line under the iris -->
      <path d="M -176 487 C -150 490 -128 489 -110 485" fill="none" stroke="#3a2a24" stroke-width="3" stroke-linecap="round"/>
      <!-- upper lash: a thick band with the outer flick and a small inner hook -->
      <path id="lash" d="M -244 396 C -232 384 -218 372 -202 366 C -175 356 -135 352 -108 360 C -96 364 -88 372 -83 384
               C -80 390 -80 398 -82 404 C -86 396 -90 390 -96 386 C -120 374 -165 373 -196 382 C -210 386 -222 392 -230 398
               C -234 402 -238 400 -244 396 Z" fill="#2b1d18"/>
      <!-- outer corner stroke down the side of the white -->
      <path id="outer" d="M -230 396 C -224 420 -218 440 -210 456 C -214 436 -218 414 -219 394 Z" fill="#2b1d18"/>
      <!-- lash flicks above the outer corner -->
      <path id="flick" d="M -232 384 C -238 378 -244 376 -252 376 C -244 372 -236 372 -226 376 Z" fill="#2b1d18"/>
      <!-- eyelid crease -->
      <path d="M -152 345 C -128 345 -106 352 -94 364" fill="none" stroke="#9c6c5c" stroke-width="2.6" stroke-linecap="round"/>
      <!-- brow: a thin tapered arc -->
      <path id="brow" d="M -216 316 C -190 302 -140 298 -84 321 C -140 306 -190 308 -216 316 Z" fill="#4e362e" stroke="#4e362e" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
  </defs>
  <rect x="-327.5" y="40" width="655" height="655" fill="#f2c8ae"/>
  <use xlink:href="#eye"/>
  <use xlink:href="#eye" transform="scale(-1 1)"/>
  <!-- catch-lights, both up and to image right -->
  <circle cx="-119" cy="399" r="9.5" fill="#fffaf8"/>
  <circle cx="171" cy="399" r="9.5" fill="#fffaf8"/>
  <!-- nose: a soft dot -->
  <ellipse cx="0" cy="507" rx="5" ry="6.5" fill="#b9806c" opacity="0.7" filter="url(#soft)"/>
  <!-- mouth: a short line -->
  <path id="mouth" d="M -22 563 C -8 561 8 561 22 563" fill="none" stroke="#a8665a" stroke-width="3.2" stroke-linecap="round"/>
</svg>
