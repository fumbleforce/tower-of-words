<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Image models</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap">
<style>
body { margin: 0; background: #f5f6f8; color: #15171c; font: 16px/1.5 "Outfit", sans-serif; }
main { max-width: 1200px; margin: 0 auto; padding: 28px 20px 60px; }
h1 { margin: 0 0 4px; font-size: 26px; } .intro { color: #4b5260; margin: 0 0 20px; max-width: 760px; }
.model { background: #fff; border: 1px solid #dadee4; border-radius: 8px; padding: 14px; margin-bottom: 14px; }
.model h2 { margin: 0; font-size: 19px; } .model p { margin: 2px 0 10px; color: #4b5260; font-size: 15px; }
.imgs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.imgs figure { margin: 0; } .imgs img { width: 100%; border-radius: 6px; display: block; }
.imgs figcaption { font-size: 13px; color: #4b5260; }
@media (max-width: 700px) { .imgs { grid-template-columns: 1fr 1fr; } }
</style></head><body><main>
<h1>Six image models, two anime styles</h1>
<p class="intro">Same two characters and the same descriptions for every model. Left pair: modern TV anime. Right pair: mature seinen anime (Psycho-Pass, Ghost in the Shell). Tell me which model and style you like, or which single images.</p>
<div id="list"></div>
<script>
const M = [
  ['nanobanana', 'Nano Banana Pro (Google)', 'Closest to a real anime production frame. The seinen versions are the most grounded of the whole test. One image added a fake TV timestamp, which is easy to prompt out. About $0.15 an image.'],
  ['seedream', 'Seedream 4.5 (ByteDance)', 'Polished, modern and very consistent between the two styles. It drew real brand logos on the cans, which I would prompt out. About $0.04 an image.'],
  ['qwen', 'Qwen-Image', 'Clean, soft TV-anime look, a little generic. Also drew brand logos. About $0.03 an image.'],
  ['ideogram', 'Ideogram v3', 'Flatter, older TV-anime look with simpler shading. About $0.03 an image.'],
  ['flux', 'FLUX 2 Pro', 'What we used so far. Glossier, the look you called AI-anime. About $0.03 an image.'],
  ['animagine', 'Animagine XL 4.0 (anime-only model)', 'Illustration or gacha-game key art rather than an anime frame, with more dramatic poses and effects. Ignores the plain background. About $0.02 an image.'],
];
const list = document.getElementById('list');
for (const [k, name, note] of M) {
  const el = document.createElement('section'); el.className = 'model';
  el.innerHTML = `<h2>${name}</h2><p>${note}</p><div class="imgs">` +
    [['tv-mio', 'TV anime: Mio'], ['tv-rei', 'TV anime: Rei'], ['seinen-mio', 'Seinen: Mio'], ['seinen-rei', 'Seinen: Rei']]
      .map(([f, c]) => `<figure><img src="${k}-${f}.webp" alt="${c}" loading="lazy"><figcaption>${c}</figcaption></figure>`).join('') + '</div>';
  list.append(el);
}
</script></main></body></html>
