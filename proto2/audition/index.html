<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice casting</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&family=M+PLUS+1:wght@500;700&display=swap">
<style>
  :root { --ink: #15171c; --ink-2: #4b5260; --line: #dadee4; --sheet: #f5f6f8; --accent: #0f8b99; }
  body { margin: 0; background: var(--sheet); color: var(--ink); font: 16px/1.5 "Outfit", "M PLUS 1", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 20px 60px; }
  h1 { margin: 0 0 4px; font-size: 26px; }
  p { color: var(--ink-2); margin: 0 0 20px; }
  .line { font: 700 18px "M PLUS 1", sans-serif; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; margin-bottom: 24px; }
  .voices { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; margin-bottom: 32px; }
  .voice { display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; cursor: pointer; text-align: left; font: inherit; color: inherit; }
  .voice.playing { border-color: var(--accent); }
  .voice b { width: 28px; height: 28px; border-radius: 6px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 12px; flex: none; }
  .cast { display: grid; gap: 10px; }
  .role { display: grid; grid-template-columns: 72px 1fr 240px; gap: 12px; align-items: center; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }
  .role small { display: block; color: var(--ink-2); }
  select { height: 38px; border-radius: 8px; border: 1px solid var(--line); font: inherit; padding: 0 8px; background: #fff; }
  button.copy { margin-top: 20px; height: 44px; padding: 0 20px; border-radius: 8px; border: 0; background: var(--accent); color: #fff; font: 600 16px "Outfit", sans-serif; cursor: pointer; }
  .role img { width: 72px; height: 90px; object-fit: cover; object-position: top; border-radius: 6px; }
  @media (max-width: 560px) { .role { grid-template-columns: 72px 1fr; } .role select { grid-column: 1 / -1; } }
</style>
</head>
<body>
<main>
  <h1>Cast and voices</h1>
  <p>Every voice reads the same line. Click one to hear it. Below, pick a voice for each character, then copy your picks back to me along with any notes on how the characters look.</p>
  <div class="line">ねえ、新人さん。今日からここで働くんでしょ？案内してあげるよ。</div>
  <div class="voices" id="voices"></div>
  <h2>Cast</h2>
  <div class="cast" id="cast"></div>
  <button class="copy" id="copy">Copy my picks</button>
  <p id="done" style="margin-top:10px"></p>
</main>
<script>
const VOICES = ['DecisivePrincess', 'ColdQueen', 'DependableWoman', 'KindLady', 'CalmLady', 'GracefulMaiden', 'SportyStudent', 'IntellectualSenior', 'OptimisticYouth', 'InnocentBoy', 'LoyalKnight', 'DominantMan', 'SeriousCommander', 'GentleButler', 'GenerousIzakayaOwner'];
const ROLES = [
  ['Mio 澪', 'Sarcastic coworker, your age', 'DecisivePrincess', 'mio'],
  ['Sayaka Makabe 真壁さやか', 'Laid-back team lead, early thirties', 'CalmLady', 'sayaka'],
  ['Hana 花', 'Reporter for the in-house paper, curious about you', 'SportyStudent', 'hana'],
  ['Rei Kuroda 黒田レイ', 'Ambitious rival in Sales', 'ColdQueen', 'rei'],
  ['Daigo 大吾', 'Production floor, big and friendly', 'GenerousIzakayaOwner', 'daigo'],
  ['Tomi-san', 'Runs the cantina, fifties', 'KindLady', 'tomi'],
  ['Gate guard', 'Bored security guard', 'SeriousCommander', ''],
];
let audio = null;
const vbox = document.getElementById('voices');
for (const v of VOICES) {
  const b = document.createElement('button');
  b.className = 'voice'; b.innerHTML = `<b>▶</b><span>${v.replace(/([a-z])([A-Z])/g, '$1 $2')}</span>`;
  b.onclick = () => {
    if (audio) audio.pause();
    document.querySelectorAll('.voice').forEach(x => x.classList.remove('playing'));
    b.classList.add('playing');
    audio = new Audio(`Japanese_${v}.mp3`); audio.play();
    audio.onended = () => b.classList.remove('playing');
  };
  vbox.append(b);
}
const cast = document.getElementById('cast');
for (const [name, desc, def, img] of ROLES) {
  const row = document.createElement('div'); row.className = 'role';
  const sel = document.createElement('select');
  VOICES.forEach(v => { const o = document.createElement('option'); o.value = v; o.textContent = v.replace(/([a-z])([A-Z])/g, '$1 $2'); o.selected = v === def; sel.append(o); });
  sel.onchange = () => { if (audio) audio.pause(); audio = new Audio(`Japanese_${sel.value}.mp3`); audio.play(); };
  row.innerHTML = (img ? `<img src="../img/${img}.webp" alt="">` : '<span></span>') + `<div><b>${name}</b><small>${desc}</small></div>`; row.append(sel); row.dataset.name = name;
  cast.append(row);
}
document.getElementById('copy').onclick = () => {
  const text = [...cast.children].map(r => `${r.dataset.name}: ${r.querySelector('select').value}`).join('\n');
  navigator.clipboard.writeText(text).then(() => { document.getElementById('done').textContent = 'Copied. Paste it into the chat.'; },
    () => { document.getElementById('done').textContent = text; });
};
</script>
</body>
</html>
