<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cast and voices</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&family=M+PLUS+1:wght@500;700&display=swap">
<style>
  :root { --ink: #15171c; --ink-2: #4b5260; --line: #dadee4; --sheet: #f5f6f8; --accent: #0f8b99; }
  body { margin: 0; background: var(--sheet); color: var(--ink); font: 16px/1.5 "Outfit", "M PLUS 1", sans-serif; }
  main { max-width: 900px; margin: 0 auto; padding: 32px 20px 60px; }
  h1 { margin: 0 0 4px; font-size: 26px; }
  .intro { color: var(--ink-2); margin: 0 0 24px; }
  .role { display: grid; grid-template-columns: 160px 1fr; gap: 20px; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 14px; margin-bottom: 14px; }
  .role img { width: 160px; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 6px; }
  .role h2 { margin: 0; font-size: 19px; }
  .role .desc { color: var(--ink-2); font-size: 14px; }
  .role .line { font: 700 17px "M PLUS 1", sans-serif; margin: 10px 0; }
  .cands { display: grid; gap: 6px; }
  .cand { display: grid; grid-template-columns: 36px 1fr auto; gap: 10px; align-items: center; padding: 6px 10px 6px 6px; border: 1px solid var(--line); border-radius: 8px; }
  .cand.picked { border-color: var(--accent); background: #eef7f8; }
  .cand button.play { width: 36px; height: 36px; border-radius: 6px; border: 0; background: var(--accent); color: #fff; cursor: pointer; font-size: 13px; }
  .cand label { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--ink-2); cursor: pointer; }
  textarea { width: 100%; min-height: 70px; border-radius: 8px; border: 1px solid var(--line); padding: 8px 10px; font: 15px "Outfit", sans-serif; margin-top: 8px; box-sizing: border-box; }
  button.copy { height: 46px; padding: 0 22px; border-radius: 8px; border: 0; background: var(--accent); color: #fff; font: 600 16px "Outfit", sans-serif; cursor: pointer; }
  #done { color: var(--ink-2); }
  @media (max-width: 600px) { .role { grid-template-columns: 1fr; } .role img { width: 100%; max-width: 260px; } }
</style>
</head>
<body>
<main>
  <h1>Cast and voices, round 2</h1>
  <p class="intro">New character designs, and three voices per character reading one of their own lines. The voices are levelled to the same loudness. Pick one per character, add notes if you like, and copy your picks back to me.</p>
  <div id="roles"></div>
  <textarea id="notes" placeholder="Notes on looks or voices (optional)"></textarea>
  <p><button class="copy" id="copy">Copy my picks</button> <span id="done"></span></p>
</main>
<script>
const INFO = {
  mio: ['Mio 澪', 'Sarcastic coworker in Planning Office 7, your age. Romance option.'],
  sayaka: ['Sayaka Makabe 真壁さやか', 'Your laid-back, brilliant team lead. Romance option.'],
  hana: ['Hana 花', 'Reporter for the in-house paper, very curious about how you work so fast. Romance option.'],
  rei: ['Rei Kuroda 黒田レイ', 'Ambitious top salesperson and your rival. Romance option.'],
  daigo: ['Daigo 大吾', 'Production floor, your friend at the bar.'],
  tomi: ['Tomi-san', 'Runs the canteen. Loud, warm, from Osaka.'],
  guard: ['Gate guard', 'Stern and bored. First person you meet.'],
};
let audio = null;
const picks = {};
fetch('r2/manifest.json').then(r => r.json()).then(M => {
  const box = document.getElementById('roles');
  for (const [role, { line, cands }] of Object.entries(M)) {
    const [name, desc] = INFO[role];
    const el = document.createElement('section'); el.className = 'role';
    el.innerHTML = `<img src="../img/${role}.webp" alt="${name}"><div><h2>${name}</h2><div class="desc">${desc}</div><div class="line">${line}</div><div class="cands"></div></div>`;
    const list = el.querySelector('.cands');
    cands.forEach((c, i) => {
      const row = document.createElement('div'); row.className = 'cand';
      row.innerHTML = `<button class="play" aria-label="Play">▶</button><span>${c.label}</span><label><input type="radio" name="${role}"> Pick</label>`;
      row.querySelector('.play').onclick = () => { if (audio) audio.pause(); audio = new Audio(`r2/${c.file}`); audio.play(); };
      row.querySelector('input').onchange = () => { picks[role] = c.label; list.querySelectorAll('.cand').forEach(x => x.classList.remove('picked')); row.classList.add('picked'); };
      list.append(row);
    });
    box.append(el);
  }
});
document.getElementById('copy').onclick = () => {
  const text = Object.keys(INFO).map(r => `${INFO[r][0]}: ${picks[r] || '(none)'}`).join('\n') + (document.getElementById('notes').value ? `\nNotes: ${document.getElementById('notes').value}` : '');
  navigator.clipboard.writeText(text).then(() => { document.getElementById('done').textContent = 'Copied. Paste it into the chat.'; }, () => { document.getElementById('done').textContent = text; });
};
</script>
</body>
</html>
