<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Decisions</title>
<style>
body{margin:0;background:#f5f6f8;color:#15171c;font:16px/1.5 system-ui,sans-serif}main{max-width:2000px;margin:0 auto;padding:24px 20px 80px}
h1{margin:0 0 4px;font-size:26px}.intro{color:#4b5260;max-width:860px}
section{background:#fff;border:1px solid #dadee4;border-radius:8px;padding:12px;margin:14px 0}h2{margin:0 0 4px;font-size:19px}section p{margin:0 0 8px;color:#4b5260}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
.opts.wide{grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr))}
label.opt{display:block;border:3px solid transparent;border-radius:8px;padding:4px;cursor:pointer;background:#eceef1}
label.opt:has(input:checked){border-color:#0f8b99;background:#dcf0f2}
label.opt img{width:100%;display:block;border-radius:5px;background:#d9dce0}
label.opt span{display:flex;gap:6px;align-items:center;font-size:14px;padding:4px 2px}
.row{display:flex;gap:10px;margin-top:8px;align-items:center;flex-wrap:wrap}
.row label{font-size:14px;color:#4b5260}
.row input[type=text]{flex:1;min-width:240px;padding:7px 10px;border:1px solid #dadee4;border-radius:6px;font:14px system-ui}
.bar{position:sticky;bottom:0;background:#15171c;color:#fff;padding:12px 20px;display:flex;gap:12px;align-items:center}
.bar button{height:42px;padding:0 20px;border-radius:8px;border:0;background:#0f8b99;color:#fff;font:600 16px system-ui;cursor:pointer}
#lb{position:fixed;inset:0;background:rgba(10,12,16,.94);display:none;place-items:center;z-index:9}#lb.on{display:grid}#lb img{max-width:96vw;max-height:92vh}
</style></head><body><main>
<h1>Decisions</h1>
<p class="intro">Pick one option per section (or "redo"), add a note if you like, then copy your picks at the bottom. Double-click any image to see it full size. The main-character alternatives will be added here when they finish rendering.</p>
<div id="list"></div></main>
<div class="bar"><button id="copy">Copy my picks</button><span id="done"></span></div>
<div id="lb"><img alt=""></div>
<script>
fetch('data.json').then(r=>r.json()).then(D=>{
  const list=document.getElementById('list');
  for(const [id,title,desc,opts,kind] of D){
    const s=document.createElement('section');
    s.innerHTML=`<h2>${title}</h2>${desc?`<p>${desc}</p>`:''}<div class="opts ${kind==='model'||id==='office'?'wide':''}"></div><div class="row"><label><input type="radio" name="${id}" value="redo"> none of these, redo</label><input type="text" data-note="${id}" placeholder="note (optional)"></div>`;
    const box=s.querySelector('.opts');
    for(const [f,lab] of opts){const l=document.createElement('label');l.className='opt';l.innerHTML=`<img src="${f}.webp" loading="lazy" alt=""><span><input type="radio" name="${id}" value="${lab}"> ${lab}</span>`;box.append(l);}
    list.append(s);
  }
  const lb=document.getElementById('lb');document.querySelectorAll('label.opt img').forEach(i=>i.ondblclick=e=>{e.preventDefault();lb.querySelector('img').src=i.src;lb.classList.add('on')});lb.onclick=()=>lb.classList.remove('on');
  document.getElementById('copy').onclick=()=>{
    const out=D.map(([id,title])=>{const v=document.querySelector(`input[name="${id}"]:checked`)?.value||'(none)';const n=document.querySelector(`[data-note="${id}"]`).value;return `${title}: ${v}${n?' | '+n:''}`}).join('\n');
    navigator.clipboard.writeText(out).then(()=>done.textContent='Copied. Paste it into the chat.',()=>done.textContent=out);
  };
});
</script></body></html>
