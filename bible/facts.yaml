# Hand-kept facts for the world bible: only what has no other source in the repo.
#
# Everything else is read live by the bible page (bible/live.js) from the files that own it:
#   GUIDE.md                        how we work and Jørgen's feedback (quoted, never copied here)
#   docs/game/                      what the game is: people (cast.md), places, storylines (stories/), words,
#                                   which portraits are approved (art-and-sound.md); quoted, never copied here
#   game3d/story/*.js, VOICE.md     the cast in play, their lines, the words and commands they teach
#   game3d/js/lang.js               every Japanese word in the game
#   game3d/js/ui.js, game3d/assets/portraits/   the portraits and expressions the game shows
#   game3d/js/cast.js               which 3D models load
#   art/approved/README.md          approved art
#   notes/RELATIONSHIPS.md, notes/ISLAND.md, notes/walkthrough/   design, not approved
#   game3d/build.json and the pushed build on GitHub Pages
#   tools/voice-refs/               voice reference clips
#
# A fact is [text, status, source]. Status: approved (Jørgen decided it), review (decided once, now being
# looked at again), draft (written or proposed by an agent, or not picked), rejected, legacy (from an
# earlier version of the game: the VN, the Godot island slice, the MVP, pixel art; kept for history).
# A source is a repo path; "path ~ phrase" finds the line with that phrase, so the link survives edits.
# {q: "path ~ phrase", s: status} is a live quote: the page shows the sentence from that file itself.

